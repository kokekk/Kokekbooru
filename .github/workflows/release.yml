name: Build & Release Kokekbooru

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Kokekbooru ^
            --collect-all rapidocr_onnxruntime ^
            --collect-all onnxruntime ^
            --collect-all ctranslate2 ^
            kokekbooru.py

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Kokekbooru/* -DestinationPath Kokekbooru-Windows-Portable.zip

      - name: Build Windows Installer (Inno Setup)
        run: |
          iscc installer.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            Kokekbooru-Windows-Portable.zip
            Output/Kokekbooru-Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --name kokekbooru \
            --collect-all rapidocr_onnxruntime \
            --collect-all onnxruntime \
            --collect-all ctranslate2 \
            kokekbooru.py

      - name: Package Linux Archive
        run: |
          tar -czvf Kokekbooru-Linux-x86_64.tar.gz -C dist kokekbooru

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: Kokekbooru-Linux-x86_64.tar.gz

  publish-release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
