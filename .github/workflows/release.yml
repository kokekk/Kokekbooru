name: Build & Release Kokekbooru

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --onedir --windowed --name Kokekbooru --icon=icon.ico --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all ctranslate2 kokekbooru.py

      - name: Create Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/Kokekbooru/* -DestinationPath Kokekbooru-Windows-Portable.zip

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc /O"." /F"Kokekbooru-Setup" installer.iss
          if (-not (Test-Path "Kokekbooru-Setup.exe")) { throw "Kokekbooru-Setup.exe was not created!" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            Kokekbooru-Windows-Portable.zip
            Kokekbooru-Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --onedir --name kokekbooru --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all ctranslate2 kokekbooru.py

      - name: Package Linux Archive
        run: tar -czvf Kokekbooru-Linux-x86_64.tar.gz -C dist kokekbooru

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: Kokekbooru-Linux-x86_64.tar.gz


  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copy kokekbooru.py into Android Python assets
        run: cp kokekbooru.py android/app/src/main/python/kokekbooru.py

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kokekbooru-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: Kokekbooru-Android.apk

  publish-release:
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
