name: Release Build (Windows, Linux, Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Setup.exe & Portable.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop & scaffold missing runner files
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .

      - name: Copy custom icon to Windows runner
        run: |
          Copy-Item -Path "icon.ico" -Destination "windows/runner/resources/app_icon.ico" -Force

      - name: Install dependencies & build Windows Release
        run: |
          flutter pub get
          flutter build windows --release

      - name: Create Kokekbooru-Windows-Portable.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/Kokekbooru-Windows-Portable.zip" -Force

      - name: Compile Kokekbooru-Setup.exe with Inno Setup
        shell: pwsh
        run: |
          iscc installer.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/Kokekbooru-Setup.exe
            dist/Kokekbooru-Windows-Portable.zip

  build-linux:
    name: Build Linux (x86_64.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GTK & build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev ffmpeg

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop & scaffold runner
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .

      - name: Build Linux Release
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package Kokekbooru-Linux-x86_64.tar.gz
        run: |
          mkdir -p dist
          tar -czvf dist/Kokekbooru-Linux-x86_64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/Kokekbooru-Linux-x86_64.tar.gz

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android platform wrapper & build APK
        run: |
          flutter create --platforms=android --org com.kokekk .
          flutter pub get
          flutter build apk --release

      - name: Rename APK to Kokekbooru-Android.apk
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Kokekbooru-Android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/Kokekbooru-Android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release and attach 4 binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_assets/Kokekbooru-Setup.exe
            release_assets/Kokekbooru-Windows-Portable.zip
            release_assets/Kokekbooru-Linux-x86_64.tar.gz
            release_assets/Kokekbooru-Android.apk
