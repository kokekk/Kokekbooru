name: kokekbooru
description: Native private local booru reference manager and AI auto-tagger for artists and collectors (Windows, Linux, Android).
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  crypto: ^3.0.5
  image: ^4.2.0
  http: ^1.2.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  video_player: ^2.9.1
  video_thumbnail: ^0.5.3
  onnxruntime: ^1.4.1
  google_mlkit_text_recognition: ^0.13.1
  google_mlkit_translation: ^0.11.1
  auto_size_text: ^3.0.0
  share_plus: ^10.0.2
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
